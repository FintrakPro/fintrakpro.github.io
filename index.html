<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#17203a;--mu:#6b7490;--ac:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--bd:#e3e7f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--tx:#e8ecf8;--mu:#93a0c4;--ac:#6b9bff;--ok:#4ade80;--bad:#f87171;--bd:#26304f}}

main{padding:8px clamp(10px,1.6vw,28px) 40px;max-width:none;width:100%;margin:0}nav{padding-left:clamp(10px,1.6vw,28px);padding-right:clamp(10px,1.6vw,28px)}@media (min-width:900px){.db .gr{grid-template-columns:repeat(3,minmax(0,1fr))}.db .tt h2{font-size:clamp(38px,4vw,64px)}.db .st b{font-size:clamp(30px,2.6vw,46px)}.db .hd{min-height:clamp(130px,13vw,200px)}.db .lg,.db .ban{height:clamp(130px,13vw,200px)}}@media (min-width:1500px){body{font-size:15px}}

h3{margin:0 0 10px;font-size:15px}
.bar{height:9px;background:var(--bd);border-radius:5px;overflow:hidden;margin:3px 0 9px}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}td.n{text-align:right}
form{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
input,select,button.p{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
button.p{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}button.s{background:none;border:0;color:var(--bad);cursor:pointer}
#gate{padding:40px 18px;text-align:center}.hide{display:none}.tag{font-size:11px;padding:2px 7px;border-radius:9px;background:var(--bd)}
pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace}
.db{background:#232f34;color:#fff;border-radius:12px;padding:0 0 12px;overflow:hidden}.db .hd{display:flex;align-items:center;gap:14px;background:#263238;min-height:130px;position:relative;flex-wrap:wrap}.db .lg{width:110px;height:130px;background:#37474f;display:grid;place-items:center}.db .tt{flex:1;text-align:center;min-width:220px;padding:8px}.db .tt h2{margin:0;font-size:38px;letter-spacing:1px}.db .tt p{margin:4px 0 0}.db .ban{width:34%;min-width:200px;height:130px;background:radial-gradient(circle at 62% 50%,#cfd8dc 0,#78909c 18%,#37474f 34%,#1c262b 70%)}.db .dt{position:absolute;right:8px;bottom:4px;font-style:italic}.db .gr{display:grid;gap:10px;padding:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.db .pn{background:#6b7b80;padding:12px 14px;border-radius:4px}.db .pn h4{margin:0 0 6px;font-size:15px}.db .st{text-align:right;padding:6px 4px;font-style:italic}.db .st b{display:block;font-size:34px;font-style:normal}.db .st span{float:left;font-weight:700;margin-top:22px}.db .st.m{background:#6b7b80}.db svg{width:100%;height:auto}.db .pn.dk{background:#2f3d43}.db .tw,.db table{color:#fff}.db th{color:#cfd8dc}.db td,.db th{border-color:#546e7a}.lgd{display:flex;gap:12px;font-size:11px;margin:2px 0}.lgd i{display:inline-block;width:9px;height:9px;margin-right:4px}.av{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;border:0}.av.big{width:64px;height:64px;font-size:22px;flex:none}#acb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;z-index:30;cursor:pointer;padding:0;box-shadow:0 1px 5px #0005;font-size:14px}header{padding-right:64px}.db .kpi{display:grid;gap:10px;padding:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.db .kp{background:#6b7b80;padding:10px 12px;border-radius:4px}.db .kp span{font-size:11px;letter-spacing:.5px}.db .kp b{display:block;font-size:clamp(18px,1.8vw,28px)}.db .sec{padding:8px 12px 0;font-size:12px;letter-spacing:1.5px;color:#b0bec5;font-weight:700}.db .cap{font-size:11px;color:#cfd8dc;margin:-3px 0 8px}.db .gr .pn{min-width:0}@media (min-width:900px){.db .w2{grid-column:span 2}}.rpt{background:#fff;color:#1b2333;border:1px solid #d5dbe8;border-radius:8px;padding:28px;max-width:1100px;margin:0 auto;font-size:13px}.rpt h1{font-size:22px;margin:0}.rpt .tp{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid #263238;padding-bottom:12px;margin-bottom:14px}.rpt h2{background:#263238;color:#fff;font-size:12px;letter-spacing:1px;padding:6px 10px;margin:18px 0 8px}.rpt table{min-width:0;width:100%}.rpt th{background:#eef1f7;color:#34405a}.rpt td,.rpt th{border-bottom:1px solid #dfe4ef;padding:6px 8px}.rpt .sm{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.rpt .bx{border:1px solid #d5dbe8;padding:8px 10px;border-radius:4px}.rpt .bx span{font-size:11px;color:#5b6784}.rpt .bx b{display:block;font-size:17px}.rpt .two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.rpt ul{margin:4px 0;padding-left:18px}.rpt li{margin-bottom:6px}.rpt .tg{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:700}.rpt .ft{margin-top:16px;font-size:11px;color:#5b6784;border-top:1px solid #dfe4ef;padding-top:8px}@media print{nav,#acb,header,.noprint{display:none!important}body{background:#fff}.rpt{border:0;padding:0}}#auth{display:none;min-height:100vh;place-items:center;padding:20px;background:linear-gradient(135deg,#1c262b,#37474f)}.ac{background:#fff;color:#1b2333;width:100%;max-width:420px;border-radius:14px;padding:26px;box-shadow:0 10px 40px #0006}.ac h3{margin:14px 0 8px;font-size:17px}.ac .k{color:#5b6784}.ac input:not([type=checkbox]){margin-bottom:9px;background:#fff;color:#1b2333}.er{background:#fee2e2;color:#991b1b;padding:8px 10px;border-radius:8px;margin-bottom:9px;font-size:13px}.inf{background:#dcfce7;color:#166534;padding:8px 10px;border-radius:8px;margin-bottom:9px;font-size:13px}.lk{text-align:center;margin:12px 0 0}.lk a{color:#1d4ed8;cursor:pointer;text-decoration:underline}.sh{display:flex;gap:6px;align-items:center;font-size:12px;margin:0 0 10px;color:#5b6784}.sh input{width:auto}.nt{font-size:11px;color:#5b6784;border-top:1px solid #e3e7f1;margin-top:16px;padding-top:10px;text-align:center}.rcb{font:700 20px ui-monospace,monospace;text-align:center;background:#eef1f7;padding:14px;border-radius:8px;margin:10px 0;letter-spacing:1px;user-select:all}#lob{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:60px;z-index:30;width:auto;padding:8px 14px;font-size:13px;background:#37474f;box-shadow:0 1px 5px #0005}header{padding-right:150px}.db .hd{background:linear-gradient(180deg,#263238 0,#232f34 100%)!important;min-height:0!important;padding:14px 0!important;border-radius:12px 12px 0 0;overflow:hidden;gap:10px;flex-wrap:nowrap}.db .lg{background:none!important;width:clamp(84px,8vw,130px)!important;height:clamp(84px,8vw,130px)!important;margin-left:22px;border-radius:50%!important;overflow:hidden;flex:none;box-shadow:0 0 0 3px rgba(207,216,220,.28),0 0 34px rgba(144,164,174,.45)}.db .tt{min-width:0!important}.db .ban{background:radial-gradient(circle at 50% 50%,rgba(225,232,236,.97) 0,rgba(160,180,190,.65) 12%,rgba(96,125,139,.34) 30%,rgba(55,71,79,.12) 48%,transparent 66%)!important;width:clamp(180px,28%,460px)!important;min-width:0!important;height:clamp(150px,14vw,230px)!important;position:relative;flex:none;margin:-14px 0}.db .ban::before,.db .ban::after{content:"";position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(207,216,220,.2);transform:translate(-50%,-50%)}.db .ban::before{width:62%;aspect-ratio:1}.db .ban::after{width:92%;aspect-ratio:1;border-color:rgba(207,216,220,.1)}.db .dt{z-index:2}@media (max-width:700px){.db .hd{flex-wrap:wrap}.db .ban{display:none}}table{min-width:0}.tw>table.wide{min-width:560px}td{overflow-wrap:anywhere}.db svg{max-width:100%;height:auto}@media (max-width:700px){table{font-size:12px}th,td{padding:5px 4px}.db .pn{padding:10px}.db .kp b{font-size:18px}.db .st b{font-size:26px}.rpt{padding:14px}}.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mu)}.fl input{font-size:14px;font-weight:400;color:var(--tx)}label.p{background:var(--ac);color:#fff;border-radius:8px;font-weight:600}.db .vs{display:grid;grid-template-rows:auto;gap:10px;min-width:0}@media (min-width:900px){.db .vs{grid-template-rows:3fr 1fr;height:100%}.db .vs>.pn{min-height:0;overflow:hidden}}.db .vs .kpi{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.db .vs .kp{padding:6px 8px}.db .vs .kp b{font-size:clamp(13px,1.2vw,18px)}.db .vs .cap{margin-bottom:4px}#adb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:146px;z-index:30;cursor:pointer;padding:0;background:#b45309;box-shadow:0 1px 5px #0005;font-size:17px}.sbtn{width:auto!important;padding:4px 9px!important;font-size:12px;margin:2px 2px 0 0}.plc{border:2px solid var(--bd);border-radius:12px;padding:14px;background:var(--card)}.plc.on{border-color:var(--ac)}</style>
</head><body>
<header style="display:flex;align-items:center;gap:12px"><span style="width:52px;height:52px;border-radius:12px;background:#37474f;display:grid;place-items:center;flex:none"><svg width="40" height="40" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="#263238" stroke="#cfd8dc" stroke-width="5"/><path d="M40 6v68M6 40h68" stroke="#cfd8dc" stroke-width="4"/><g fill="#cfd8dc"><rect x="16" y="26" width="10" height="10" rx="2"/><rect x="16" y="46" width="10" height="10" rx="2"/><rect x="54" y="26" width="12" height="6"/><rect x="54" y="36" width="12" height="6"/><rect x="54" y="46" width="12" height="6"/></g></svg></span><h1>FinTrak Pro <small>Your Partner in Smarter Financial Management</small></h1></header>
<div id="auth"></div><button id="lob" class="p" title="Log out">Log out</button><button class="av" id="adb" title="Admin page" aria-label="Admin page" style="display:none">🛡</button><button class="av" id="acb" title="Account" aria-label="Account"></button><div id="gate" class="hide"><div class="c">Sign in to open your private finance workspace.</div></div>
<nav id="nav"></nav><main id="m"></main>
<script>
const PHP=n=>"₱ "+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const TYPES=["EXPENSES","INCOME","TRANSFER","CREDIT/ LOAN","MONTHLY UPDATE","SOA"];
const GOALS={"EMERGENCY FUND":20000,"INVESTMENT FUND":10000,"SAVINGS":20000,"LIQUID FUND":10000,"WANTS FUND":20000};
const DEF={accounts:{"CASH":"LIQUID FUND","PAYMAYA WALLET":"LIQUID FUND","GCASH WALLET":"LIQUID FUND","PNB SAVINGS":"EMERGENCY FUND","GCASH SAVINGS":"SAVINGS","MP2":"SAVINGS","PAYMAYA SAVINGS GOAL":"SAVINGS","PAYMAYA SAVINGS":"WANTS FUND","INVESTMENT CRYPTO":"INVESTMENT FUND","MARIBANK":"INVESTMENT FUND","BDO PAYROLL":"PAYROLL","STERLING PAYROLL":"PAYROLL"},
 credits:["ETOMO","SHOPEE LOAN","EJ SHOPEE ORDER","PAYMAYA CREDIT","GCASH CREDIT","ATOME","TALA","TONIK","UNION CREDIT CARD","BILLEASE","PAYMAYA LOAN","HSBC CREDIT CARD","LANDERS CC","PNB CREDIT CARD","PAGIBIG HOUSING LOAN","SSS EDUCATIONAL","PAGIBIG LOAN","SSS LOAN","SALMON"],
 cats:["FOODS/ GROCERIES","TRANSPORATION","WATER","ELECTRICTY","OTHER EXPENSES"]};
let S={tx:[],cfg:JSON.parse(JSON.stringify(DEF)),goals:GOALS},tab="Dashboard",mon=new Date().toISOString().slice(0,7),store=null,me="you";
const $=(s)=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inMon=x=>x.date.startsWith(mon);
function balances(){const b={};const a=n=>b[n]=b[n]||0;
 S.tx.forEach(x=>{const m=+x.amount;if(x.type==="INCOME"){if(x.dest){a(x.dest);b[x.dest]+=m}}
 else if(x.type==="EXPENSES"){if(S.cfg.accounts[x.source]){a(x.source);b[x.source]-=m}if(S.cfg.accounts[x.dest]){a(x.dest);b[x.dest]+=m}}
 else if(x.type==="TRANSFER"){if(x.source){a(x.source);b[x.source]-=m}if(x.dest){a(x.dest);b[x.dest]+=m}}
 else if(x.type==="CREDIT/ LOAN"&&S.cfg.accounts[x.dest]){a(x.dest);b[x.dest]+=m}});return b}
function debts(){const U=S.tx.filter(x=>x.type==="MONTHLY UPDATE");if(!U.length)return{};const mk=U.reduce((m,x)=>x.date.slice(0,7)>m?x.date.slice(0,7):m,""),d={};U.filter(x=>x.date.startsWith(mk)).sort((p,q)=>p.date<q.date?-1:1).forEach(x=>d[x.source]=+x.amount);return d}
function stats(m){const T=S.tx.filter(x=>x.date.startsWith(m)),sum=(f)=>T.filter(f).reduce((s,x)=>s+ +x.amount,0);
 const cat={};T.filter(x=>x.type==="EXPENSES"||(x.type==="CREDIT/ LOAN"&&!S.cfg.accounts[x.dest])).forEach(x=>{const k=x.dest||"OTHER";cat[k]=(cat[k]||0)+ +x.amount});
 return{inc:sum(x=>x.type==="INCOME"),exp:sum(x=>x.type==="EXPENSES"),cat,T}}
function soaRows(){const last={};S.tx.filter(x=>x.type==="SOA").forEach(x=>{if(!last[x.source]||x.date>=last[x.source].date)last[x.source]=x});return Object.values(last).sort((a,b)=>(a.due||"")<(b.due||"")?-1:1)}
function fundCards(){const b=balances(),f={};for(const[n,t]of Object.entries(S.cfg.accounts))f[t]=(f[t]||0)+(b[n]||0);
 return Object.entries(S.goals).map(([k,g])=>{const v=f[k]||0,p=Math.max(0,Math.min(100,v/g*100));return `<div><div class="row"><span>${k}</span><span>${PHP(v)} / ${PHP(g)}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}
function dash(){const s=stats(mon),d=debts(),td=Object.values(d).reduce((a,b)=>a+b,0),net=s.inc-s.exp,mx=Math.max(1,...Object.values(s.cat));
 const soa=soaRows(),tot=soa.reduce((a,x)=>a+ +x.amount,0),mn=soa.reduce((a,x)=>a+ +(x.minDue||0),0);
 return `<div class="g"><div class="c"><div class="k">Income</div><div class="v pos">${PHP(s.inc)}</div></div><div class="c"><div class="k">Expenses</div><div class="v neg">${PHP(s.exp)}</div></div><div class="c"><div class="k">Net</div><div class="v ${net<0?"neg":"pos"}">${PHP(net)}</div></div><div class="c"><div class="k">Total Credit / Loan Balance</div><div class="v">${PHP(td)}</div></div></div>
 <div class="c"><h3>Funds vs Goals</h3>${fundCards()}</div>
 <div class="c"><h3>Expenses by Category — ${mon}</h3>${Object.entries(s.cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${PHP(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div>`).join("")||'<span class="k">No expenses this month.</span>'}</div>
 <div class="c"><h3>SOA Update <span class="tag">Total ${PHP(tot)} · Min due ${PHP(mn)}</span></h3>${soaTable(soa)}</div>
 <div class="c"><h3>Credit / Loan Standing</h3>${Object.entries(d).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${PHP(v)}</b></div>`).join("")||'<span class="k">Add "MONTHLY UPDATE" entries to track balances.</span>'}</div>`}
function soaTable(r){return `<div class="tw"><table><tr><th>Creditor</th><th>Due date</th><th class="n">Amount due</th><th class="n">Min. due</th></tr>${r.map(x=>`<tr><td>${esc(x.source)}</td><td>${esc(x.due||"")}</td><td class="n">${PHP(x.amount)}</td><td class="n">${PHP(x.minDue)}</td></tr>`).join("")||'<tr><td colspan=4 class="k">No SOA entries yet.</td></tr>'}</table></div>`}
function opts(a,sel){return `<option value="">—</option>`+a.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("")}
function log(){const all=[...Object.keys(S.cfg.accounts),...S.cfg.credits],dst=[...all,...S.cfg.cats];
 return `<div class="c"><h3>New Transaction</h3><form id="f" style="align-items:end"><label class="fl">Date<input type="date" name="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="fl">Transaction type<select name="type">${TYPES.map(t=>`<option>${t}</option>`).join("")}</select></label><label class="fl">Source (From)<select name="source">${opts(all)}</select></label><label class="fl">Destination (To / Category)<select name="dest">${opts(dst)}</select></label><label class="fl">Details / Notes<input name="details" placeholder="e.g. Lunch, Salary"></label><label class="fl">Amount (₱)<input name="amount" type="number" step="0.01" required placeholder="0.00"></label><label class="fl">Due date (SOA only)<input name="due" type="date"></label><label class="fl">Min. amount due (SOA only)<input name="minDue" type="number" step="0.01" placeholder="0.00"></label><button class="p">Add</button></form><div class="k" style="margin-top:6px"><b>How to fill it in</b><br>EXPENSES — Source: account or wallet you paid from · Destination: category (or the creditor you are paying).<br>INCOME — Destination: the account that receives the money.<br>TRANSFER — Source → Destination between your own accounts.<br>CREDIT/ LOAN — Source: lender · Destination: account or category that receives it.<br>MONTHLY UPDATE — Source: creditor · Amount: balance you still owe.<br>SOA — Source: creditor · Amount: amount due, plus the due date and minimum due.</div></div>
 <div class="c"><h3>Daily Logsheet — ${mon}</h3><div class="tw"><table class="wide"><tr><th>Date</th><th>Type</th><th>Source</th><th>Destination</th><th>Details</th><th class="n">Amount</th><th></th></tr>${S.tx.map((x,i)=>[x,i]).filter(([x])=>inMon(x)).sort((a,b)=>a[0].date<b[0].date?1:-1).map(([x,i])=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${esc(x.source)}</td><td>${esc(x.dest)}</td><td>${esc(x.details)}</td><td class="n">${PHP(x.amount)}</td><td style="white-space:nowrap"><button class="s" style="color:var(--ac);font-size:16px" data-edit="${i}" title="Edit" aria-label="Edit">✎</button> <button class="s" data-del="${i}" title="Delete" aria-label="Delete">✕</button></td></tr>`).join("")}</table></div></div>`}
function report(){const s=stats(mon),d=debts(),b=balances(),td=Object.values(d).reduce((a,b)=>a+b,0);
 const cat=Object.entries(s.cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`  ${k}: ${PHP(v)} (${s.exp?Math.round(v/s.exp*100):0}%)`).join("\n")||"  none";

 <div class="tw"><table class="wide" style="min-width:860px"><tr><th>Name</th><th>Email</th><th>Plan</th><th>Status</th><th>Access until</th><th>Joined</th><th>Last sign-in</th><th class="n">Entries</th><th>Actions</th></tr>${F.map(r=>`<tr><td>${esc(r.full_name||'—')}</td><td>${esc(r.email)}</td><td>${esc(r.plan||'—')}</td><td>${stg(stt(r))}</td><td>${esc(r.expires||'—')}</td><td>${fdt(r.created_at)}</td><td>${r.last_login?esc(String(r.last_login).slice(0,16).replace('T',' ')):'—'}</td><td class="n">${r.tx_count??'—'}</td><td>${acts(r)}</td></tr>`).join('')||'<tr><td colspan="9" class="k">No accounts in this view.</td></tr>'}</table></div>
 <div class="k" style="margin-top:8px">Approve = grants access for the trial period. “+ Monthly / Yearly paid” records a payment and extends access by one month / one year. Removing access blocks sign-in at once; the user’s records stay stored but unreachable until you restore access.</div></div>`}
async function adm(b){const id=b.dataset.id,act=b.dataset.act,it=ADM.find(x=>x.id===id);if(!it||!IS_ADMIN||it.role==='admin')return;
 if(['remove','del','rejectpay'].includes(act)&&CONF!==id+act){CONF=id+act;render();return}CONF='';let e=null;
 const R=async(fn,a)=>{const{error}=await sb.rpc(fn,a);if(error)e=error};
 if(act==='approve')await R('admin_approve',{p_uid:id});
 else if(act==='suspend')await R('admin_set_status',{p_uid:id,p_status:'suspended'});
 else if(act==='activate')await R('admin_set_status',{p_uid:id,p_status:'active'});
 else if(act==='remove')await R('admin_set_status',{p_uid:id,p_status:'removed'});
 else if(act==='del')await R('admin_delete_user',{p_uid:id});
 else if(act==='free1'||act==='free3')await R('admin_grant_free',{p_uid:id,p_months:act==='free3'?3:1,p_note:'Admin bonus'});
 else if(act==='payM'||act==='payY')await R('admin_record_payment',{p_uid:id,p_plan:act==='payY'?'Yearly':'Monthly',p_method:'Manual',p_ref:it.req_ref||''});
 else if(act==='confirmpay')await R('admin_record_payment',{p_uid:id,p_plan:it.requested_plan,p_method:it.req_method||'',p_ref:it.req_ref||''});
 else if(act==='rejectpay'){const{error}=await sb.from('profiles').update({requested_plan:null,req_method:null,req_ref:null,req_at:null}).eq('id',id);if(error)e=error}
 if(e)alert('Could not complete that action: '+errMsg(e));await loadAdm();render()}
async function genCode(){const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>al[x%32]).join(''),code='FREE-'+r.slice(0,4)+'-'+r.slice(4),g=i=>document.getElementById(i);
 const{error}=await sb.from('codes').insert({code,months:+g('gm').value||1,max_uses:Math.max(1,+g('gx').value||1),note:(g('gn').value||'').trim()});if(error)alert('Could not create the code: '+errMsg(error));await loadAdm();render()}
async function codeAct(b){const c=b.dataset.code,it=CODES.find(x=>x.code===c);if(!it||!IS_ADMIN)return;let e;
 if(b.dataset.ca==='toggle'){e=(await sb.from('codes').update({active:!it.active}).eq('code',c)).error}
 else{if(CONF!=='c'+c){CONF='c'+c;render();return}CONF='';e=(await sb.from('codes').delete().eq('code',c)).error}
 if(e)alert(errMsg(e));await loadAdm();render()}
const CFCOL={monthly:'monthly_price',yearly:'yearly_price',trial:'trial_days',instr:'instructions'};
async function saveCfg(k,v){const col=CFCOL[k]||k,{error}=await sb.from('app_config').update({[col]:v}).eq('id',1),m=document.getElementById('cfm');if(m)m.textContent=error?'Could not save: '+errMsg(error):'Saved ✓'}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='reqpay'){await reqPay();return}if(b.id==='redeem'){await redeem();return}
 if(b.id==='admref'){await loadAdm();return}
 if(b.dataset.act){await adm(b);return}
 if(b.dataset.flt!==undefined){FLT=b.dataset.flt;render();return}
 if(b.id==='gen'){await genCode();return}if(b.dataset.code){await codeAct(b);return}
 if(b.dataset.rmqr&&IS_ADMIN){CFG[b.dataset.rmqr]='';await saveCfg(b.dataset.rmqr,'');render()}});
document.addEventListener('change',async e=>{const x=e.target;if(!IS_ADMIN||!x.dataset)return;
 if(x.dataset.cfg){const k=x.dataset.cfg,v=x.type==='number'?Math.max(0,+x.value||0):x.value.trim();CFG[k]=v;await saveCfg(k,v)}
 if(x.dataset.qr&&x.files&&x.files[0]){const k=x.dataset.qr,r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);CFG[k]=c.toDataURL('image/jpeg',.9);saveCfg(k,CFG[k]).then(render)};im.src=r.result};r.readAsDataURL(x.files[0])}});

function render(){CH=[];HB=[];const au=document.getElementById('auth');au.style.display=locked?'grid':'none';document.getElementById('adb').style.display=(!locked&&IS_ADMIN)?'grid':'none';if(GATE&&tab!=='Account')tab='Subscription';document.getElementById('acb').style.display=locked?'none':'';document.getElementById('lob').style.display=locked?'none':'';
 if(locked){document.querySelector('header').style.display='none';document.getElementById('nav').innerHTML='';document.getElementById('m').innerHTML='';au.innerHTML=authHtml();return}
 setTimeout(fixLogos,0);document.getElementById("acb").textContent=ini()||"👤";document.querySelector("header").style.display=tab==="Dashboard"?"none":"flex";
 const T=GATE?["Subscription","Account"]:["Dashboard","Daily Log","SOA","Report","Settings","Account","Subscription"].concat(IS_ADMIN?["Admin"]:[]);
 $("#nav").innerHTML=T.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("")+`<input type="month" id="mo" value="${mon}" style="width:auto;margin-left:auto">`;
 $("#m").innerHTML=tab==="Dashboard"?dash5():tab==="Daily Log"?log():tab==="SOA"?`<div class="c"><h3>Statements of Account</h3>${soaTable(soaRows())}<div class="k" style="margin-top:8px">Add SOA entries in Daily Log with type SOA.</div></div>`:tab==="Report"?rep2():tab==="Account"?acct():tab==="Subscription"?subHtml():tab==="Admin"&&IS_ADMIN?adminHtml():sett()}
document.addEventListener("click",e=>{const x=e.target;
 if(x.dataset.t){tab=x.dataset.t;render();if(tab==='Admin')loadAdm();if(tab==='Subscription'&&!IS_ADMIN)checkMe()}
 if(x.dataset.del){EDIT=null;S.tx.splice(+x.dataset.del,1);save();render()}});

document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 if(f.id==="f"){if(EDIT!=null&&S.tx[EDIT]){S.tx[EDIT]={...d,id:S.tx[EDIT].id};EDIT=null}else S.tx.push(d);if(d.date.slice(0,7)!==mon)mon=d.date.slice(0,7);save();render()}
 if(f.id==="a"){const n=d.n.trim().toUpperCase();if(d.k==="acc")S.cfg.accounts[n]=d.fund||"LIQUID FUND";else if(d.k==="cr")S.cfg.credits.push(n);else S.cfg.cats.push(n);save();render()}});

 if(!READY){AV='setup';render();return}
 render();
 try{const{data:{session}}=await sb.auth.getSession();await new Promise(r=>setTimeout(r,60));if(RECOVERY){AV='newpw';render()}else if(session)await enter(session.user);else{AV='login';render()}}catch(e){AV='login';ERR='Could not reach the server. '+errMsg(e);render()}
}
