<style>
/* Layout: Nexora system shell. Dark teal header + left sidebar (account and Settings pinned at the bottom); light content with sub-tab bar, eyebrow page head and white cards. Single light theme on purpose, matching the Nexora product family. */
:root{
  --chrome:#0f2a2c; --chrome-2:#163a3c; --chrome-line:#24474a; --chrome-ink:#eef4f4; --chrome-muted:#a3b8ba; --teal:#6cc0b6;
  --bg:#f3f5f9; --surface:#ffffff; --line:#dde3ea; --ink:#0f1b30; --muted:#5b6677; --eyebrow:#1550b0; --tabbar:#eaf0ef;
  --primary:#163a3c; --primary-ink:#ffffff; --soft:#e3efee;
  --good:#1a7a4c; --good-soft:#dcf1e5; --warn:#a35d00; --warn-soft:#fbead0; --bad:#b4302a; --bad-soft:#f7dedb;
  --f-head:"Barlow","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-head);text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:flex;flex-direction:column}
/* Header */
.hdr{background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--chrome-line);
  padding-block:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.hdr-logo{display:block;height:88px;width:auto;flex:none}
.hdr-div{width:1px;align-self:stretch;background:var(--chrome-line);flex:none}
.hdr-brand{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-start;gap:18px}
.poweredby{display:flex;flex-direction:column;gap:6px;padding:12px 12px 4px;margin-top:6px;border-top:1px solid var(--chrome-line)}
.poweredby span{font-family:var(--f-head);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--chrome-muted)}
.poweredby img{width:100%;max-width:200px;height:auto;display:block}
.hdr-nexo{height:76px;width:auto;flex:none;display:block}
.hdr-title{font-family:var(--f-head);font-weight:700;font-size:62px;letter-spacing:.06em;color:#9fd9d0;line-height:1;flex:none;text-transform:uppercase}
.hdr-client{display:flex;align-items:center;gap:14px;flex:0 1 auto;min-width:0;padding-left:20px;border-left:1px solid var(--chrome-line)}
.cwrap{min-width:0;display:flex;flex-direction:column;gap:3px}
.clbl{font-family:var(--f-head);font-weight:600;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--chrome-muted)}
.clogo{width:58px;height:58px;border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.clogo img{width:100%;height:100%;object-fit:contain}
.clogo .ini{font-family:var(--f-head);font-weight:700;font-size:23px;color:var(--chrome);letter-spacing:.02em}
.logoedit{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logoedit .clogo{width:96px;height:96px;border:1px solid var(--line)}
.logoedit .clogo .ini{font-size:36px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.feerow{display:flex;gap:8px}.feerow .rate{position:relative;flex:0 0 96px}.feerow .rate input{width:100%;padding-right:28px}.feerow .rate i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);pointer-events:none}.feerow>input{flex:1;min-width:0}
.scanphoto{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:48px}
.cname{font-family:var(--f-head);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;max-width:min(36vw,380px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dlapp{display:inline-flex;align-items:center;gap:8px;flex:none;border:0;border-radius:999px;background:var(--teal);color:#0b2224;font-family:var(--f-head);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;padding:11px 18px;box-shadow:0 0 0 4px rgba(108,192,182,.18)}.dlapp:hover{filter:brightness(1.06)}.dlapp .dl-s{display:none}@media (max-width:760px){.dlapp{padding:7px 11px;font-size:13px;margin-left:auto;gap:5px;box-shadow:none}.dlapp svg{width:15px;height:15px}.dlapp .dl-l{display:none}.dlapp .dl-s{display:inline}}.burger{display:none;border:1px solid var(--chrome-line);background:transparent;color:var(--chrome-ink);border-radius:8px;padding:7px}

.shell{flex:1;min-height:0;display:flex}
/* Sidebar */
.side{width:265px;flex:none;background:var(--chrome);color:var(--chrome-muted);display:flex;flex-direction:column;padding:22px 16px 14px max(18px,env(safe-area-inset-left,0px));gap:6px;overflow:auto}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;color:var(--chrome-muted);
  font-family:var(--f-head);font-weight:600;font-size:16px;line-height:1.2;padding:12px 12px;border-radius:9px;border-left:3px solid transparent}
.nav button:hover{color:var(--chrome-ink);background:rgba(255,255,255,.04)}
.nav button[aria-current="page"]{background:var(--chrome-2);color:var(--chrome-ink);border-left-color:var(--teal)}
.side-foot{margin-top:auto;border-top:1px solid var(--chrome-line);padding-top:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.acct{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--chrome-ink);padding:8px 8px;border-radius:10px;text-align:left;width:100%}
.acct:hover{background:rgba(255,255,255,.05)}
.avatar{width:40px;height:40px;border-radius:50%;background:#3d6f6a;color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:15px;flex:none;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.acct .who{flex:1;min-width:0}
.acct .nm{display:block;font-family:var(--f-head);font-weight:700;font-size:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .rl{display:block;font-size:13px;color:var(--chrome-muted)}
.acct .chev{transition:transform .15s}
.acct[aria-expanded="false"] .chev{transform:rotate(180deg)}
.setbtn{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--chrome-muted);font-family:var(--f-head);font-weight:600;font-size:16px;padding:10px 12px;border-radius:9px;border-left:3px solid transparent;width:100%;text-align:left}
.setbtn:hover{color:var(--chrome-ink)}
.setbtn[aria-current="page"]{background:var(--chrome-2);color:var(--chrome-ink);border-left-color:var(--teal)}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(5,20,22,.35);padding:8px;z-index:40}
.menu .mh{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .mh b{display:block;font-family:var(--f-head);font-size:16px}
.menu .mh span{font-size:12.5px;color:var(--muted);word-break:break-all}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;text-align:left;font-weight:500}
.menu button:hover{background:var(--bg)}
.scrimside{display:none}

/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.subtabs{display:flex;align-items:flex-end;gap:6px;background:var(--tabbar);border-bottom:1px solid var(--line);padding-top:8px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow-x:auto}
.subtabs button{border:0;background:transparent;font-family:var(--f-head);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:#8aa3a6;padding:10px 16px;border-radius:9px 9px 0 0;white-space:nowrap;border-bottom:3px solid transparent}
.subtabs button[aria-selected="true"]{background:var(--primary);color:#fff;border-bottom-color:var(--teal)}
.subtabs .cap{margin-left:auto;align-self:center;font-size:13.5px;color:#8fa6a8;white-space:nowrap;padding-left:16px}
.page{flex:1;min-height:0;overflow:auto;padding-block:22px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;display:flex;flex-direction:column;gap:18px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-head);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--eyebrow);margin-bottom:4px}
.phead h2{font-size:30px;font-weight:700;letter-spacing:-.005em}
.dor{text-align:right}
.dor .k{font-family:var(--f-head);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dor .v{font-family:var(--f-mono);font-size:19px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-size:17px;font-weight:700;margin-bottom:12px}
.lbl{font-family:var(--f-head);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#3d4757}
.filters{display:flex;flex-wrap:wrap;gap:14px 12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld input,.fld select{border:1px solid #cdd5df;border-radius:10px;padding:10px 12px;background:var(--surface);font-size:15px;min-width:0;width:100%}
.btn{border:1px solid #cdd5df;background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn:hover{border-color:#9fb0bf}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.go{background:var(--teal);border-color:var(--teal);color:#0b2224}
.btn.danger{color:var(--bad);border-color:#e6b3ae}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.big{width:100%;padding:14px;font-size:17px;font-family:var(--f-head);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.kpi .k{font-family:var(--f-head);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#3d4757}
.kpi .v{font-family:var(--f-head);font-weight:700;font-size:32px;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:13.5px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--f-head);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:#eef1f5;color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.low{background:var(--warn-soft);color:var(--warn)}.pill.out{background:var(--bad-soft);color:var(--bad)}.pill.sample{background:var(--soft);color:#2d6a64}
.voided td{opacity:.5;text-decoration:line-through}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.chart{display:flex;align-items:flex-end;gap:4px;height:180px;padding-top:20px;border-bottom:1px solid var(--line);position:relative}
.bar{flex:1;min-width:0;display:flex;align-items:flex-end;justify-content:center;height:100%}
.bar i{display:block;width:100%;max-width:30px;border-radius:5px 5px 0 0;background:#2f7f78;min-height:2px}
.bar i.zero{background:#e4e9ee}
.gridline{position:absolute;left:0;right:0;top:20px;border-top:1px dashed var(--line)}
.gridline span{position:absolute;right:0;top:-17px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.xlab{display:flex;gap:4px;margin-top:6px}
.xlab span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap}
.hbar{height:8px;border-radius:4px;background:#e8edf1;overflow:hidden;margin-top:6px}
.hbar i{display:block;height:100%;background:#2f7f78}

/* Register */
.reg{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 370px}
.catalog{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;padding-block:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:18px}
.search{border:1px solid #cdd5df;background:var(--surface);border-radius:10px;padding:11px 14px;font-size:15px;width:100%}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid #cdd5df;background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;align-content:start;padding-bottom:90px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:110px;transition:transform .08s,border-color .15s}
.tile:hover{border-color:var(--teal)}
.tile:active{transform:scale(.97)}
.tile .nm{font-weight:600;font-size:14px;line-height:1.25;flex:1}
.tile .row{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.tile .pr{font-family:var(--f-head);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.tile .un{font-size:11.5px;color:var(--muted)}
.empty{border:1.5px dashed #cdd5df;border-radius:14px;padding:28px;text-align:center;color:var(--muted);grid-column:1/-1;background:var(--surface)}
.cart{min-width:0;min-height:0;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column}
.cart-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.cart-h h3{font-size:18px}
.lines{flex:1;min-height:0;overflow:auto;padding:4px 16px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .ln{font-weight:600;font-size:14px}
.line .lt{font-family:var(--f-head);font-weight:700;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid #cdd5df;background:var(--bg);font-weight:700;font-size:16px;line-height:1}
.qty input{width:62px;text-align:center;border:1px solid #cdd5df;border-radius:8px;padding:4px;font-family:var(--f-mono)}
.line .at{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:flex-end}
.x{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.pay{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sumrow{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-head);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.total .num{font-size:28px;letter-spacing:0}
.seg{display:flex;flex-wrap:wrap;gap:5px}

  const S=240,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);
  const sc=Math.min(S/img.width,S/img.height);const w=img.width*sc,h=img.height*sc;x.drawImage(img,(S-w)/2,(S-h)/2,w,h);res(c.toDataURL('image/jpeg',0.9))};img.src=r.result};r.readAsDataURL(file)})}

const Store={db:null,
  async init(){
    if(window.claude&&typeof window.claude.use==='function'){try{this.db=await window.claude.use('db')}catch(e){this.db=null}}
    try{USER=window.claude&&typeof window.claude.use==='function'?await window.claude.use('user'):null}catch(e){USER=null}
    if(USER){try{const me=await USER.me();st.me.id=me.id;st.me.name=me.name||'';st.me.email=me.email||null;
      const own=await USER.isOwner(),ed=await USER.canEdit(),w=await USER.can('data.write');
      st.me.role=own?'Owner':ed?'Manager':w===false?'Viewer':'Cashier';if(w===false)st.canWrite=false}catch(e){}}
    renderAccount();
    if(!this.db){st.mode='local';await this.loadLocal();st.loaded=true;restoreActor();renderAll(true);return}
    st.mode='db';
    const got={s:0,p:0,x:0};const fire=()=>{if(got.s&&got.p&&got.x&&!st.loaded){st.loaded=true;restoreActor();renderAll(true)}else if(st.loaded)renderAll(false)};
    const fail=e=>{if(e&&e.code==='revoked'){st.canWrite=false;renderAll(false)}};
    this.db.doc('pos/purchase').onSnapshot(s=>{if(s.exists){const d=s.data();st.plan={qty:d.qty||{},cost:d.cost||{},off:d.off||{},extra:d.extra||[],sup:d.sup||{},budget:d.budget??''};if(st.loaded&&st.view==='products')renderAll(false)}},fail);
    this.db.doc('pos/settings').onSnapshot(s=>{st.settings={...DEFAULT_SETTINGS,...(s.exists?s.data():{})};got.s=1;fire()},fail);
    this.db.collection('products').onSnapshot(q=>{st.products=q.docs.map(d=>({id:d.id,...d.data()}));got.p=1;fire()},fail);
    this.db.collection('sales').where('ts','>=',startOfDay()-89*864e5).orderBy('ts','desc').limit(1000)
      .onSnapshot(q=>{st.sales=q.docs.map(d=>({id:d.id,...d.data()}));got.x=1;resolveNames();fire()},fail);
    this.db.collection('staff').onSnapshot(q=>{st.staff=q.docs.map(d=>({id:d.id,...d.data()}));restoreActor();if(st.loaded)renderAll(false)},fail);
    this.db.collection('shifts').onSnapshot(q=>{st.shifts=q.docs.map(d=>({id:d.id,...d.data()}));if(st.loaded&&(st.view==='dash'||st.view==='settings'))renderAll(false)},fail);
    this.db.collection('activity').orderBy('ts','desc').limit(150).onSnapshot(q=>{st.activity=q.docs.map(d=>({id:d.id,...d.data()}));if(st.loaded&&st.view==='settings'&&st.sub.settings==='staff')renderAll(false)},fail);
    this.db.collection('reports').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());st.saved=m;if(st.loaded&&(st.view==='reports'||st.view==='dash'))renderAll(false)},fail);
    this.db.collection('customers').onSnapshot(q=>{st.customers=q.docs.map(d=>({id:d.id,...d.data()}));if(st.loaded)renderAll(false)},fail);
    this.db.collection('suppliers').onSnapshot(q=>{st.suppliers=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));if(st.loaded&&st.view==='products')renderAll(false)},fail);
    this.db.collection('sales').where('method','==','Utang').where('utangPaid','==',false).limit(500)
      .onSnapshot(q=>{st.utang=q.docs.map(d=>({id:d.id,...d.data()})).filter(s=>!s.voided);if(st.loaded)renderAll(false)},fail);
  },

  for(const pid in by){const p=st.products.find(x=>x.id===pid);if(!p||!p.track)continue;const lots=lotsOf(p).map(b=>({...b}));let short=shortOf(p);
    for(const a of by[pid]){let q=a.q;let lot=a.b&&lots.find(b=>b.id===a.b);if(lot){const t=Math.min(q,lot.qty);lot.qty-=t;q-=t}
      for(const b of lots){if(q<=0)break;const t=Math.min(q,b.qty);b.qty-=t;q-=t}if(q>0)short+=q}

    for(const a of [...by[pid]].reverse()){let q=a.q;if(!a.b){const t=Math.min(q,short);short-=t;q-=t;if(q<=0)continue}

function demand(){const k=[st.sales,coverDays(),leadDays()];if(DM.k&&DM.k.every((x,i)=>x===k[i]))return DM.m;
  const since=startOfDay()-29*864e5,live=st.sales.filter(s=>!s.voided&&s.ts>=since);const first=live.reduce((a,s)=>Math.min(a,s.ts),Date.now());
  const span=Math.min(30,Math.max(7,Math.ceil((Date.now()-first)/864e5)));const m={};
  live.forEach(s=>s.items.forEach(i=>{const x=m[i.pid]||(m[i.pid]={sold:0});x.sold+=i.qty}));
  for(const id in m){const x=m[id];x.avg=x.sold/span;x.span=span;x.target=Math.ceil(x.avg*(coverDays()+leadDays()));x.reorder=Math.ceil(x.avg*(leadDays()+2))}

    else if(c==='"')q=true;else if(c===','||c===';'||c==='\t'){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}

      ${['GCash','Maya','Card'].includes(st.method)?`<label class="fld"><span class="lbl">Reference no. (optional)</span><input id="ref" value="${esc(st.customer)}" data-act="cust" placeholder="Last 4 digits or ref no."></label>`:''}

  updateTotals();custInfoLine();

  const bar=$('#cartbar');if(bar)bar.innerHTML=`<span><b style="font-family:var(--f-head);font-size:18px">${money(t.total)}</b><br><span style="opacity:.75;font-size:13px">${st.cart.length} item${st.cart.length===1?'':'s'}</span></span><button class="btn go" data-act="opencart">View sale</button>`}
function updateTotals(){const t=totals();const d=$('#discOut'),o=$('#totOut');if(d)d.textContent='−'+money(t.disc);if(o)o.textContent=money(t.total);
  const c=$('#changeOut');let ok=st.cart.length>0;
  if(c){if(st.tendered===''){c.innerHTML=''}else{const ch=r2((+st.tendered||0)-t.total);c.innerHTML=`<div class="change ${ch<0?'short':''}"><span>${ch<0?'Still short':'Change'}</span><span class="mono">${money(Math.abs(ch))}</span></div>`;if(ch<0)ok=false}}
  if(st.method==='Utang'&&!st.customer.trim())ok=false;
  const uh=$('#ucHint');if(uh)uh.hidden=!(hasUtangCash()&&st.method!=='Utang');if(hasUtangCash()&&st.method!=='Utang')ok=false;

function addToCart(id,q=1){const p=st.products.find(x=>x.id===id);if(!p)return;const l=st.cart.find(x=>x.pid===id);
  if(l)l.qty=r2(l.qty+q);else st.cart.push({pid:p.id,name:p.name,price:priceNow(p),cost:costNow(p),unit:p.unit||'pc',qty:q});

async function checkout(){const t=totals();if(!st.cart.length)return;const now=new Date();

  const sale={id:uid(),no:'R'+d+'-'+String(Math.floor(Math.random()*9000)+1000),ts:now.getTime(),at:now.toISOString(),
    items:st.cart.map(l=>{if(l.svc)return {pid:l.pid,name:l.name,qty:1,price:l.price,cost:l.cost,total:l.price,unit:'',svc:l.svc,note:l.note||'',cat:'Services',dept:'others'};const lp=linePrice(l);return {pid:l.pid,name:l.name,qty:l.qty,price:r2(lp.total/l.qty),cost:r2(lp.cost/l.qty),total:lp.total,alloc:lp.al,unit:l.unit,cat:(st.products.find(p=>p.id===l.pid)||{}).cat||'Other'}}),
    subtotal:t.sub,discount:t.disc,total:t.total,method:st.method,
    tendered:st.method==='Cash'?(st.tendered===''?t.total:r2(+st.tendered)):t.total,change:st.method==='Cash'&&st.tendered!==''?r2(+st.tendered-t.total):0,

  await consumeStock(sale.items);
  st.cart=[];st.discV=0;st.tendered='';st.customer='';st.customerId=null;st.cartOpen=false;if(st.method==='Utang')st.method='Cash';renderCart();showReceipt(sale)}

/* ---------- Receipt ---------- */
function receiptText(s){const W=32,line='-'.repeat(W);const pad=(a,b)=>{a=String(a);b=String(b);return a+' '.repeat(Math.max(1,W-a.length-b.length))+b};
  const center=x=>{x=String(x);return ' '.repeat(Math.max(0,Math.floor((W-x.length)/2)))+x};const dt=new Date(s.ts);
  const when=dt.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})+' '+dt.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
  const m=n=>r2(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
  const out=[center((st.settings.name||'My Store').toUpperCase())];if(st.settings.address)out.push(center(st.settings.address));
  out.push(line,s.no,when);if(s.cashier||s.staffName)out.push('Cashier: '+sellerName(s));out.push(line);
  const blank=l=>l+' '+'_'.repeat(Math.max(4,W-l.length-1));out.push(blank('Client Name:'),'',blank('TIN No.:'),'',blank('Location:'),'',line);
  s.items.forEach(i=>{if(i.svc){out.push(pad(i.name.slice(0,W-12),m(i.total??i.price)));if(i.note)out.push('  '+i.note.slice(0,W-2));out.push(pad(i.svc==='utangcash'?'  Cash given':'  Amount of goods',m(i.cost)));if(i.price>i.cost)out.push(pad('  Interest/service fee',m(i.price-i.cost)));return}out.push(i.name.slice(0,W));const g={};(i.alloc||[{q:i.qty,p:i.price}]).forEach(a=>{g[a.p]=(g[a.p]||0)+a.q});
    Object.entries(g).forEach(([pr,q])=>out.push(pad(`  ${qfmt(q,i.unit)} ${i.unit} x ${m(+pr)}`,m(q*pr))))});
  out.push(line,pad('Subtotal',m(s.subtotal)));if(s.discount)out.push(pad('Discount','-'+m(s.discount)));out.push(pad('TOTAL',cur()+m(s.total)));
  if(s.method==='Cash')out.push(pad('Cash',m(s.tendered)),pad('Change',m(s.change)));else if(s.method==='Utang'){out.push(pad('Utang ni',s.customer||''));const sch=scheduleOf(s);if(sch.length>1){out.push(`Terms: ${sch.length} monthly payments`);sch.forEach((x,ix)=>out.push(pad(`  ${ix+1}. Due ${fmtDue(x.due)}`,m(x.amount))))}else if(s.dueDate)out.push(pad('Due date',fmtDue(s.dueDate)));if(paidOf(s)>0){out.push(pad('Paid so far',m(paidOf(s))),pad('Balance',m(balOf(s))))}}else out.push(pad('Paid via',s.method+(s.customer?' '+s.customer:'')));
  if(s.voided)out.push('','*** VOIDED ***');out.push(line);if(st.settings.footer)out.push(center(st.settings.footer));return out.join('\n')}
function showReceipt(s){openModal(`<h2>${s.voided?'Voided sale':s.method==='Utang'?'Utang recorded':'Sale complete'}</h2>
  ${!s.voided&&s.method==='Cash'&&s.change>0?`<div class="change"><span>Give change</span><span class="mono">${money(s.change)}</span></div>`:''}
  <pre class="receipt" id="rcpt">${esc(receiptText(s))}</pre>
  <div class="rtools">
    <button class="rtool" data-act="printRcpt"><svg class="ic" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>Print</button>
    <button class="rtool" data-act="saveImg"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Save as picture</button>
    <button class="rtool" data-act="shareRcpt" aria-expanded="false" id="shareBtn"><svg class="ic" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Share</button>
    <button class="rtool" data-act="copyRcpt"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy text</button>
  </div>
  <div id="sharePanel" hidden></div>
  <div class="mfoot"><button class="btn primary" data-act="closeModal">${st.view==='sell'?'Next customer':'Done'}</button></div>`);st.rcpt=s}

/* ---------- Receipt as picture / PDF / share ---------- */
let DL=null,dlTried=false;
async function getDL(){if(dlTried)return DL;dlTried=true;try{DL=window.claude&&typeof window.claude.use==='function'?await window.claude.use('downloads'):null}catch(e){DL=null}if(!DL)DL=LOCAL_DL;return DL}
const LOCAL_DL={async save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}};
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function receiptCanvas(s){try{await document.fonts.load('600 24px "IBM Plex Mono"')}catch(e){}
  const lines=receiptText(s).split('\n');const W=576,pad=40,lh=34,fs=24;let top=36;
  const logo=st.settings.logo&&/^data:image\//.test(st.settings.logo)?await loadImg(st.settings.logo):null;const LS=120;
  const nx=await loadImg(NEXO_LOGO);const H=top+(logo?LS+18:0)+lines.length*lh+40+(nx?78:0);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
  if(logo){x.drawImage(logo,(W-LS)/2,top,LS,LS);top+=LS+18}
  x.fillStyle='#111111';x.textBaseline='top';
  lines.forEach((ln,i)=>{x.font=(i===0||/^TOTAL/.test(ln)?'700 ':'500 ')+fs+'px "IBM Plex Mono", Menlo, Consolas, monospace';x.fillText(ln,pad,top+i*lh)});
  if(nx){const y0=top+lines.length*lh+22;x.font='500 16px "IBM Plex Mono", monospace';x.fillStyle='#777';x.textAlign='center';x.fillText('Powered by',W/2-80,y0+18);x.textAlign='left';x.drawImage(nx,W/2-18,y0,165,50)}
  return c}
const rcptName=ext=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `RECEIPT-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${ext}`};
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
async function offerFile(name,blob,fallbackImg){const dl=await getDL();
  if(dl){try{await dl.save({filename:name,data:blob});toast('Saved '+name);return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('A save is already open. Finish it first.');return}}}
  if(fallbackImg){const url=URL.createObjectURL(fallbackImg);openModal(`<h2>Save receipt picture</h2><p class="muted" style="margin:0">Press and hold the picture (or right-click it) and choose Save image.</p><img class="rimg" src="${url}" alt="Receipt picture"><div class="mfoot"><button class="btn primary" data-act="closeModal">Done</button></div>`)}
  else toast('Saving files is not available here. Use Save as picture instead.')}
async function saveReceiptImage(s){const c=await receiptCanvas(s);const b=await toBlob(c);await offerFile(rcptName('png'),b,b)}
async function printReceipt(s){const c=await receiptCanvas(s);
  if(!window.jspdf||!window.jspdf.jsPDF){toast('PDF tool did not load. Saving a picture to print instead.');return saveReceiptImage(s)}
  const w=80,h=c.height/c.width*w;const pdf=new window.jspdf.jsPDF({unit:'mm',format:[w,Math.max(h,60)],orientation:'portrait'});
  pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,w,h);const b=pdf.output('blob');
  await offerFile(rcptName('pdf'),b,await toBlob(c))}
function sharePanel(s){const txt=receiptText(s);const sum=`${st.settings.name||'Store'} receipt ${s.no}: ${money(s.total)}`;const enc=encodeURIComponent;
  return `<a href="https://wa.me/?text=${enc('```'+txt+'```')}" target="_blank" rel="noopener">WhatsApp</a>

    <p>For Messenger or Viber: tap <b>Copy picture</b> or <b>Copy text</b>, then paste it in the chat. <b>Save as picture</b> saves the receipt to your Downloads or Photos.</p>`}

/* ---------- Dashboard ---------- */
function rangeStart(k){const t=startOfDay();return k==='today'?t:k==='7d'?t-6*864e5:k==='30d'?t-29*864e5:t-89*864e5}
const RL={today:'Today','7d':'Last 7 days','30d':'Last 30 days','90d':'Last 90 days'};
function stats(k){const live=st.sales.filter(s=>s.ts>=rangeStart(k)&&!s.voided);const total=r2(live.reduce((a,s)=>a+s.total,0));
  const cost=live.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0),0);return {live,total,profit:r2(total-cost),avg:live.length?total/live.length:0}}
function chartHTML(k,live){let b=[];
  if(k==='today'){for(let h=6;h<=22;h++)b.push({l:h%12===0?'12':String(h%12),k:h,v:0});live.forEach(s=>{const h=new Date(s.ts).getHours();(b.find(x=>x.k===h)||(h<6?b[0]:b[b.length-1])).v+=s.total})}
  else{const n=k==='7d'?7:k==='30d'?30:90;for(let i=n-1;i>=0;i--){const t=startOfDay()-i*864e5;const d=new Date(t);b.push({k:dayKey(t),l:n===7?d.toLocaleDateString('en-US',{weekday:'short'}):(i%(n===30?5:15)===0?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):''),v:0})}
    live.forEach(s=>{const x=b.find(y=>y.k===dayKey(s.ts));if(x)x.v+=s.total})}
  const max=Math.max(...b.map(x=>x.v),0);
  return `<div class="chart">${max>0?`<div class="gridline"><span>${money(max)}</span></div>`:''}${b.map(x=>`<div class="bar" title="${esc(x.l||x.k)}: ${money(x.v)}"><i class="${x.v?'':'zero'}" style="height:${max?Math.max(1,x.v/max*100):1}%"></i></div>`).join('')}</div>
    <div class="xlab">${b.map(x=>`<span>${esc(x.l)}</span>`).join('')}</div>${max===0?'<p class="muted" style="margin:10px 0 0">No sales in this period yet. Completed sales show up here right away.</p>':''}`}
function renderDash(){const k=st.sub.dash;const S=stats(k);const low=st.products.filter(p=>p.track&&(+p.stock||0)<=lowOf(p)).sort((a,b)=>(+a.stock||0)-(+b.stock||0));
  const ut=r2(st.utang.reduce((a,s)=>a+balOf(s),0));const recent=st.sales.filter(s=>!s.voided).slice(0,6);
  $('#view').innerHTML=`<div class="page"><div class="wrap">${phead('Store overview','Sales Dashboard')}${closingBanner()}
    <div class="kpis">
      <div class="kpi"><div class="k">Sales</div><div class="v">${money(S.total)}</div><div class="s">${RL[k]}</div></div>
      <div class="kpi"><div class="k">Transactions</div><div class="v">${S.live.length}</div><div class="s">Avg ${money(S.avg)} per sale</div></div>
      <div class="kpi"><div class="k">Gross profit</div><div class="v" style="color:${S.profit<0?'var(--bad)':'var(--good)'}">${money(S.profit)}</div><div class="s">Sales minus item cost</div></div>
      <div class="kpi"><div class="k">Unpaid utang</div><div class="v">${money(ut)}</div><div class="s">${st.utang.length} open account${st.utang.length===1?'':'s'}</div></div>
    </div>

      <div class="card"><h3>Restock soon</h3><div class="list">${low.length?low.slice(0,7).map(p=>`<div class="li"><span>${esc(p.name)}</span><span class="pill ${(+p.stock||0)<=0?'out':'low'}">${qfmt(+p.stock||0,p.unit)} ${esc(p.unit)}</span></div>`).join(''):'<p class="muted" style="margin:0">All tracked items are above their warning level.</p>'}</div></div></div>
    ${staffOn()?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px"><h3 style="margin:0">On shift now</h3>${curRole()==='Owner'?'<button class="btn sm" data-act="goStaff">Staff &amp; access</button>':''}</div><div class="shiftrow">${onShift().length?onShift().map(x=>{const tdy=st.sales.filter(s=>s.staffId===x.id&&!s.voided&&s.ts>=startOfDay());return `<div class="shift"><span class="avatar">${esc(initials(x.name))}</span><div><b>${esc(x.name)}</b><span>${esc(x.role)} · since ${new Date(x.since).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span><span class="mono">${tdy.length} sales · ${money(tdy.reduce((a,s)=>a+s.total,0))}</span></div></div>`}).join(''):'<p class="muted" style="margin:0">Nobody is signed in on a counter right now.</p>'}</div></div>`:''}
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px"><h3 style="margin:0">Latest sales</h3><button class="btn sm" data-act="view" data-v="sales">All records</button></div>
      <div class="list">${recent.length?recent.map(s=>`<div class="li"><span><span class="mono">${new Date(s.ts).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})}</span> · ${s.items.length} item${s.items.length===1?'':'s'} · ${esc(s.method)}</span><span class="mono">${money(s.total)}</span></div>`).join(''):'<p class="muted" style="margin:0">No sales yet. Ring one up in Point of Sale.</p>'}</div></div>
  </div></div>`}

/* ---------- Products ---------- */
function renderProducts(){const tab=st.sub.products;if(tab==='restock')return renderRestock();if(tab==='suppliers')return renderSuppliers();const f=st.pfilter.toLowerCase();const focus=document.activeElement&&document.activeElement.id==='pf';

    <td class="hide-sm">${esc(c.phone||'')}${c.phone&&c.address?'<br>':''}<span class="muted">${esc(c.address||'')}</span>${!c.phone&&!c.address?'<span class="muted">—</span>':''}</td><td class="r mono">${x.open.length}</td><td class="r mono" style="color:${x.owed?'var(--bad)':'inherit'};font-weight:600">${money(x.owed)}</td>

async function saveCustomerForm(id,key){const g=k=>$('#c-'+k);const name=g('name').value.trim();if(!name){const e=$('#c-err');e.hidden=false;e.textContent='Enter the customer’s name.';return}
  const dup=st.customers.find(c=>nk(c.name)===nk(name)&&c.id!==id);if(dup){const e=$('#c-err');e.hidden=false;e.textContent='A customer with that name already exists. Use a fuller name to tell them apart.';return}
  const old=st.customers.find(c=>c.id===id)||{};const c={...old,id:id||uid(),name,phone:g('phone').value.trim(),address:g('addr').value.trim(),notes:g('notes').value.trim(),limit:r2(g('limit').value),createdAt:old.createdAt||new Date().toISOString()};
  if(!(await guard(()=>Store.saveCustomer(c))))return;
  if(key&&key.startsWith('n:')){for(const s of st.utang.filter(s=>!s.customerId&&('n:'+nk(s.customer))===key)){try{await Store.patchSale(s.id,{customerId:c.id,customer:name})}catch(e){}}}
  closeModal();toast(id?'Customer updated':'Customer saved');if(st.view==='sales'&&st.sub.sales==='utang')fillUtang()}

      <td><div class="acts"><button class="btn sm" data-act="viewSale" data-id="${s.id}">View</button>${s.voided?'':`<button class="btn sm danger" data-act="voidSale" data-id="${s.id}">Void</button>`}</div></td></tr>`).join('')
      :`<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">${st.sales.length?'No sales match these filters.':'No sales recorded yet. Completed sales from Point of Sale appear here.'}</td></tr>`}</tbody></table>`}

const p2=n=>String(n).padStart(2,'0');
const ymKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const fmtDate=ts=>new Date(ts).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
const closeTime=()=>st.settings.closeTime||'21:00';
function itemsAgg(live){const m={};live.forEach(s=>{const f=s.subtotal?s.total/s.subtotal:1;s.items.forEach(i=>{const v=(i.total??i.price*i.qty)*f;const x=m[i.name]||(m[i.name]={q:0,v:0,c:0,u:i.unit,d:DEPT_LABEL[deptOf(st.products.find(p=>p.id===i.pid)||{cat:i.cat})]});x.q+=i.qty;x.v+=v;x.c+=(i.cost||0)*i.qty})});return m}
function summaryKV(sales){const live=sales.filter(s=>!s.voided),void_=sales.filter(s=>s.voided);const gross=r2(live.reduce((a,s)=>a+s.subtotal,0)),disc=r2(live.reduce((a,s)=>a+(s.discount||0),0)),net=r2(live.reduce((a,s)=>a+s.total,0));
  const cogs=r2(live.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(i.cost||0)*i.qty,0),0));const items=live.reduce((a,s)=>a+s.items.reduce((b,i)=>b+(DEC_UNITS.has(i.unit)?1:i.qty),0),0);
  return {live,net,cogs,kv:[['Gross sales',gross,1],['Less: discounts',disc,1],['Net sales',net,1],['Cost of goods sold',cogs,1],['Gross profit',r2(net-cogs),1],['Gross margin',net?Math.round((net-cogs)/net*100)+'%':'—'],
    ['Transactions',live.length],['Items sold',items],['Average sale',live.length?r2(net/live.length):0,1],['Voided sales',`${void_.length} (${money(void_.reduce((a,s)=>a+s.total,0))})`]]}}

/* ---------- Monthly insights (products & staff) ---------- */
function monthRange(ym){const [Y,M]=ym.split('-').map(Number);return [new Date(Y,M-1,1).getTime(),new Date(Y,M,1).getTime()]}
function insightsData(ym){const [t0,t1]=monthRange(ym);const now=Date.now();const days=Math.max(1,Math.ceil((Math.min(t1,now)-t0)/864e5));
  const sales=st.sales.filter(s=>s.ts>=t0&&s.ts<t1);const S=summaryKV(sales);const live=S.live;const net=S.net,cogs=S.cogs,profit=r2(net-cogs),om=net?profit/net*100:0;
  const pd=new Date(t0);pd.setMonth(pd.getMonth()-1);const pk=ymKey(pd.getTime());const [p0,p1]=monthRange(pk);const prev=st.sales.filter(s=>s.ts>=p0&&s.ts<p1&&!s.voided);const prevNet=r2(prev.reduce((a,s)=>a+s.total,0));
  const prevLoaded=p0>=startOfDay()-89*864e5;const chg=prevNet>0&&prevLoaded?Math.round((net-prevNet)/prevNet*100):null;
  const I={};live.forEach(s=>{const f=s.subtotal?s.total/s.subtotal:1;s.items.forEach(i=>{const k=i.pid||('n:'+i.name);const x=I[k]||(I[k]={pid:i.pid,name:i.name,u:i.unit,q:0,v:0,c:0});x.q+=i.qty;x.v+=(i.total??i.price*i.qty)*f;x.c+=(i.cost||0)*i.qty})});
  const lastSold={};st.sales.forEach(s=>{if(s.voided)return;s.items.forEach(i=>{if(i.pid&&(!lastSold[i.pid]||s.ts>lastSold[i.pid]))lastSold[i.pid]=s.ts})});
  const sold=Object.values(I).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);const med=sold.length?sold[Math.floor((sold.length-1)/2)].v:0;const thr=Math.max(5,om*.6);
  const lowProfit=sold.filter(x=>{const m=(x.v-x.c)/x.v*100;return x.v-x.c<0||(x.v>=med&&m<thr)}).map(x=>{const p=st.products.find(y=>y.id===x.pid);const l0=p?lotsOf(p)[0]:null;const cn=p?costNow(p):0;
    return {...x,p:r2(x.v-x.c),m:Math.round((x.v-x.c)/x.v*100),sell:p?priceNow(p):null,cost:cn,sug:p&&cn?suggestPrice(cn,l0&&l0.sid?supMk(p,l0.sid):markupFor(p)):null}});
  const val=p=>lotsOf(p).reduce((a,b)=>a+b.qty*b.cost,0);
  const noSale=st.products.filter(p=>!I[p.id]).map(p=>({p,v:val(p),last:lastSold[p.id]||0})).sort((a,b)=>b.v-a.v||a.p.name.localeCompare(b.p.name));
  const asap=st.products.filter(p=>p.track&&(+p.stock||0)>0&&(+p.stock||0)>lowOf(p)).map(p=>{const q=(I[p.id]||{}).q||0;const per=q/days;const cover=per>0?(+p.stock)/per:Infinity;const l=lotsOf(p);
      const age=l.length&&l[0].at?Math.floor((now-new Date(l[0].at).getTime())/864e5):null;
      const why=per===0?'No sales this month: promo, bundle or display it in front':cover>90?`About ${Math.round(cover)} days to sell: discount or bundle, stop reordering`:cover>45?`About ${Math.round(cover)} days of stock: don't reorder yet`:`Oldest stock is ${age} days old: sell it first`;
      return {p,q,per,cover,age,v:val(p),why,flag:cover>45||(age!=null&&age>60)}}).filter(x=>x.flag).sort((a,b)=>b.v-a.v);
  const U={};sales.forEach(s=>{const k=sellerName(s)||'—';const x=U[k]||(U[k]={n:0,v:0,c:0,q:0,disc:0,ut:0,voids:0,hrs:{}});if(s.voided){x.voids++;return}
    x.n++;x.v+=s.total;x.c+=s.items.reduce((a,i)=>a+(i.cost||0)*i.qty,0);x.q+=s.items.reduce((a,i)=>a+(+i.qty||0),0);x.disc+=+s.discount||0;if(s.method==='Utang')x.ut+=s.total;const h=new Date(s.ts).getHours();x.hrs[h]=(x.hrs[h]||0)+1});
  const staff=Object.entries(U).map(([name,x])=>({name,...x,best:Object.entries(x.hrs).sort((a,b)=>b[1]-a[1])[0]})).sort((a,b)=>b.v-a.v);
  const H={};live.forEach(s=>{const h=new Date(s.ts).getHours();const x=H[h]||(H[h]={n:0,v:0});x.n++;x.v+=s.total});
  const D=[];for(let t=t0;t<t1;t+=864e5){const dk=dayKey(t);const x=live.filter(s=>dayKey(s.ts)===dk);D.push({dk,t,n:x.length,v:r2(x.reduce((a,s)=>a+s.total,0)),fut:t>now})}
  const secs={};Object.values(itemsAgg(live)).forEach(x=>{secs[x.d]=(secs[x.d]||0)+x.v});

      rows:X.asap.map(x=>[x.p.name,qfmt(+x.p.stock,x.p.unit)+' '+x.p.unit,r2(x.per),isFinite(x.cover)?Math.round(x.cover):'No sales',x.age!=null?x.age+' days':'—',r2(x.v),x.why]),empty:'No overstocked items. Stock is moving well.'}},

    {h:'Sales by section',table:{cols:[{t:'Section'},{t:'Net sales',a:'r',m:1},{t:'Share',a:'r'}],rows:Object.entries(X.secs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,r2(v),X.net?Math.round(v/X.net*100)+'%':'—']),empty:'No sales this month.'}},
    {h:'Busiest hours',table:{cols:[{t:'Hour'},{t:'Sales count',a:'r'},{t:'Net sales',a:'r',m:1}],rows:Object.keys(X.H).sort((a,b)=>a-b).map(h=>[hrLbl(h)+' – '+hrLbl((+h+1)%24),X.H[h].n,r2(X.H[h].v)]),empty:'No sales this month.'}},

function reportFor(kind,v){return kind==='insights'?insightsReport(v):kind==='daily'?dailyReport(v):kind==='monthly'?monthlyStatement(v):rangeReport(v)}
function closingDue(){const [h,m]=closeTime().split(':').map(Number);const now=new Date();return now.getHours()*60+now.getMinutes()>=h*60+m&&!st.saved['d-'+dayKey(Date.now())]}
function closingBanner(){if(!closingDue())return '';const t=dayKey(Date.now());const n=st.sales.filter(s=>!s.voided&&dayKey(s.ts)===t);
  return `<div class="card closing"><div><div class="eyebrow" style="color:inherit">End of day</div><b style="font-size:17px">Store closed at ${esc(new Date('2000-01-01T'+closeTime()).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}))}. Save today's daily report.</b><div style="font-size:13.5px;opacity:.85">${n.length} transactions · ${money(n.reduce((a,s)=>a+s.total,0))} net sales</div></div>
    <div class="acts"><button class="btn" data-act="repOpen" data-k="daily" data-v="${t}">Preview</button><button class="btn go" data-act="repQuick" data-k="daily" data-v="${t}" data-f="pdf">Save PDF</button></div></div>`}
function downloadsCard(k){const today_=dayKey(Date.now());if(!st.repDay)st.repDay=today_;if(!st.repMonth)st.repMonth=ymKey(Date.now());
  const months=[0,1,2].map(i=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);return ymKey(d.getTime())});
  const days=[];for(let i=0;i<14;i++){const t=startOfDay()-i*864e5;const dk=dayKey(t);const x=st.sales.filter(s=>!s.voided&&dayKey(s.ts)===dk);if(x.length||i===0)days.push({dk,t,n:x.length,v:x.reduce((a,s)=>a+s.total,0)})}
  return `${closingBanner()}<div class="card"><h3>Download reports</h3><div class="dlgrid">
    <div class="dlbox"><div class="lbl">Daily report</div><p class="muted">Sales, payments, cash drawer count, utang, items sold and every transaction for one day.</p>
      <div class="filters"><label class="fld" style="flex:1 1 150px"><span class="lbl" style="font-size:11px">Date</span><input id="rep-day" type="date" value="${st.repDay}" max="${today_}"></label></div>
      <div class="acts" style="justify-content:flex-start"><button class="btn sm" data-act="repOpen" data-k="daily">Preview</button><button class="btn sm" data-act="repQuick" data-k="daily" data-f="xlsx">Excel</button><button class="btn sm primary" data-act="repQuick" data-k="daily" data-f="pdf">PDF</button></div></div>
    <div class="dlbox"><div class="lbl">Monthly statement of account</div><p class="muted">Income summary, collections, utang receivable, customer balances, inventory value and daily breakdown.</p>

      <div class="acts" style="justify-content:flex-start"><button class="btn sm" data-act="repOpen" data-k="monthly">Preview</button><button class="btn sm" data-act="repQuick" data-k="monthly" data-f="xlsx">Excel</button><button class="btn sm primary" data-act="repQuick" data-k="monthly" data-f="pdf">PDF</button></div></div>
    <div class="dlbox"><div class="lbl">This report · ${esc(RL[k])}</div><p class="muted">The summary, payments and items shown on this page, as a file you can print or keep.</p>
      <div class="filters"><label class="fld" style="flex:1 1 150px"><span class="lbl" style="font-size:11px">Store closes at</span><input id="rep-close" type="time" value="${closeTime()}"></label></div>
      <div class="acts" style="justify-content:flex-start"><button class="btn sm" data-act="repOpen" data-k="range" data-v="${k}">Preview</button><button class="btn sm" data-act="repQuick" data-k="range" data-v="${k}" data-f="xlsx">Excel</button><button class="btn sm primary" data-act="repQuick" data-k="range" data-v="${k}" data-f="pdf">PDF</button></div></div></div>
    <div class="lbl" style="margin:18px 0 6px">Daily reports · last 14 days</div><div class="tablewrap"><table><thead><tr><th>Date</th><th class="r">Transactions</th><th class="r">Net sales</th><th>Saved</th><th></th></tr></thead><tbody>
    ${days.map(x=>{const sv=st.saved['d-'+x.dk];return `<tr><td>${esc(fmtDate(x.t))}${x.dk===today_?' <span class="pill">today</span>':''}</td><td class="r mono">${x.n}</td><td class="r mono">${money(x.v)}</td><td>${sv?`<span class="pill ok">Saved ${new Date(sv.savedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>`:'<span class="pill low">Not yet</span>'}</td>

function renderReports(){const k=st.sub.reports;if(k==='insights')return renderInsights();const S=stats(k);
  const byI={},byC={},byM={},byK={};S.live.forEach(s=>{byM[s.method]=(byM[s.method]||0)+s.total;const c=sellerName(s);byK[c]=byK[c]||{n:0,v:0};byK[c].n++;byK[c].v+=s.total;
    const f=s.subtotal?s.total/s.subtotal:1;s.items.forEach(i=>{const v=(i.total??i.price*i.qty)*f;byI[i.name]=byI[i.name]||{q:0,v:0,p:0,u:i.unit};byI[i.name].q+=i.qty;byI[i.name].v+=v;byI[i.name].p+=v-(i.cost||0)*i.qty;
      const cat=i.cat||(st.products.find(p=>p.id===i.pid)||{}).cat||'Other';byC[cat]=(byC[cat]||0)+v})});
  const top=Object.entries(byI).sort((a,b)=>b[1].v-a[1].v).slice(0,10);const cats=Object.entries(byC).sort((a,b)=>b[1]-a[1]);const cmax=Math.max(...cats.map(c=>c[1]),0);
  const margin=S.total?Math.round(S.profit/S.total*100):0;
  $('#view').innerHTML=`<div class="page"><div class="wrap">${phead('Performance','Sales Reports')}${downloadsCard(k)}
    <div class="kpis"><div class="kpi"><div class="k">Sales</div><div class="v">${money(S.total)}</div><div class="s">${RL[k]}</div></div>
      <div class="kpi"><div class="k">Gross profit</div><div class="v" style="color:${S.profit<0?'var(--bad)':'var(--good)'}">${money(S.profit)}</div><div class="s">${margin}% margin</div></div>
      <div class="kpi"><div class="k">Transactions</div><div class="v">${S.live.length}</div><div class="s">voids excluded</div></div>
      <div class="kpi"><div class="k">Average sale</div><div class="v">${money(S.avg)}</div><div class="s">per transaction</div></div></div>
    <div class="card"><h3>${k==='today'?'Sales by hour':'Sales by day'}</h3>${chartHTML(k,S.live)}</div>
    <div class="card" style="padding:6px 8px"><div style="padding:12px 12px 0"><h3>Best sellers</h3></div><div class="tablewrap"><table><thead><tr><th>Item</th><th class="r">Qty sold</th><th class="r">Sales</th><th class="r hide-sm">Profit</th></tr></thead><tbody>
      ${top.length?top.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="r mono">${qfmt(v.q,v.u)} ${esc(v.u)}</td><td class="r mono">${money(v.v)}</td><td class="r mono hide-sm">${money(v.p)}</td></tr>`).join(''):'<tr><td colspan="4" class="muted" style="text-align:center;padding:20px">Top items appear after the first sales in this period.</td></tr>'}</tbody></table></div></div>
    <div class="two"><div class="card"><h3>Sales by category</h3>${cats.length?cats.map(([c,v])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(c)}</span><span class="mono">${money(v)}</span></div><div class="hbar"><i style="width:${cmax?v/cmax*100:0}%"></i></div></div>`).join(''):'<p class="muted" style="margin:0">No sales in this period yet.</p>'}</div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0"><div class="card"><h3>By payment</h3><div class="list">${METHODS.map(m=>`<div class="li"><span>${m}</span><span class="mono">${money(byM[m]||0)}</span></div>`).join('')}</div></div>
      <div class="card"><h3>By cashier</h3><div class="list">${Object.keys(byK).length?Object.entries(byK).sort((a,b)=>b[1].v-a[1].v).map(([id,x])=>`<div class="li"><span>${esc(id)} <span class="muted">· ${x.n} sale${x.n===1?'':'s'}</span></span><span class="mono">${money(x.v)}</span></div>`).join(''):'<p class="muted" style="margin:0">No sales in this period yet.</p>'}</div></div></div></div>
  </div></div>`}

  if(a==='voidSale'){const s=st.sales.find(x=>x.id===id);return confirmBox('Void this sale?',`Receipt <b class="mono">${esc(s.no)}</b> for <b class="mono">${money(s.total)}</b> will be marked void and its items go back into stock.`,'Void sale',async()=>{if(await guard(()=>Store.patchSale(id,{voided:true,utangPaid:true}))){await restoreStock(s.items);logAct('Voided sale',`${s.no} · ${money(s.total)}`);closeModal();toast('Sale voided')}})}
  if(a==='payUtang')return payForm(id,t.dataset.k);
  if(a==='payQuick'){$('#pay-amt').value=v;return}
  if(a==='payMethod'){document.querySelectorAll('#paySeg button').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));return}
  if(a==='paySave')return savePayment(id,t.dataset.k);
  if(a==='viewLoan')return openLoan(id);
  if(a==='payUtangOld'){const s=st.utang.find(x=>x.id===id);const k=t.dataset.k;return confirmBox('Mark as paid?',`${esc(s.customer)} paid <b class="mono">${money(s.total)}</b>.`,'Mark paid',async()=>{if(await guard(()=>Store.patchSale(id,{utangPaid:true,paidAt:new Date().toISOString()}))){if(st.mode==='db')st.utang=st.utang.filter(x=>x.id!==id);closeModal();toast('Utang marked paid');if(k)openCustomer(k)}})}
  if(a==='payAll'){const x=customerStats().find(y=>y.key===t.dataset.k);if(!x)return;return confirmBox('Mark all as paid?',`${esc(x.name)} paid all ${x.open.length} entries, <b class="mono">${money(x.owed)}</b> in total.`,'Mark all paid',async()=>{const at=new Date().toISOString();for(const s of x.open){const bal=balOf(s);const prev=(s.payments&&s.payments.length)?s.payments:[];if(!(await guard(()=>Store.patchSale(s.id,{utangPaid:true,paidAt:at,payments:[...prev,{at,amount:bal,method:'Cash',by:st.me.id||null}]}))))return}if(st.mode==='db')st.utang=st.utang.filter(s=>!x.open.includes(s));closeModal();toast('All utang marked paid')})}
  if(a==='openCust')return openCustomer(t.dataset.k);
  if(a==='editCust')return customerForm(t.dataset.k||'');
  if(a==='saveCust')return saveCustomerForm(id,t.dataset.k);
  if(a==='delCust'){const c=st.customers.find(x=>x.id===id);return confirmBox('Delete customer?',`<b>${esc(c.name)}</b> and their contact details will be removed. Past sales keep the name.`,'Delete',async()=>{if(await guard(()=>Store.deleteCustomer(id))){closeModal();toast('Customer deleted')}})}
  if(a==='confirmYes'){const f=pending;pending=null;if(f)await f();return}
  if(a==='ptype'){const s={...st.settings,type:v};if(await guard(()=>Store.saveSettings(s))){st.settings=s;renderAll(true)}return}
  if(a==='loadPreset')return loadPreset();
  if(a==='saveMarkup'){const v=$('#s-mk').value;if(v===''||+v<0){toast('Enter a markup of 0% or more.');return}const s2={...st.settings,markup:r2(v)};if(await guard(()=>Store.saveSettings(s2))){st.settings=s2;renderAll(true);toast('Default markup saved')}return}
  if(a==='removeLogo'){const s={...st.settings,logo:''};if(await guard(()=>Store.saveSettings(s))){st.settings=s;renderAll(true);toast('Logo removed. Showing initials.')}return}
  if(a==='saveSettings'){const s={...st.settings,name:$('#s-name').value.trim()||'My Store',currency:$('#s-cur').value.trim()||'₱',address:$('#s-addr').value.trim(),footer:$('#s-foot').value.trim()};
    if(await guard(()=>Store.saveSettings(s))){st.settings=s;renderAll(false);logAct('Changed store details');toast('Store details saved')}return}
  if(a==='wipe'){const what=v;return confirmBox(what==='sales'?'Delete all sales?':'Delete all products?',what==='sales'?'Every recorded sale and utang entry is erased. Stock levels stay as they are.':'Every product is erased. Past sales keep their records.','Delete all',async()=>{
    if(what==='sales'){for(const x of [...new Set([...st.sales,...st.utang].map(s=>s.id))]){if(!(await guard(()=>Store.deleteSale(x))))break}}else{for(const p of [...st.products]){if(!(await guard(()=>Store.deleteProduct(p.id))))break}}
    logAct('Deleted all '+what);closeModal();toast('Deleted')})}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='svA'){st.sv.amt=t.value;svAutoFee();fillSvSched();return updateSvc()}if(t.id==='svR'){st.sv.rate=t.value;svAutoFee();fillSvSched();return updateSvc()}if(t.id==='svF'){st.sv.fee=t.value;const a=+st.sv.amt||0;if(a>0&&t.value!==''){st.sv.rate=String(Math.round(+t.value/a*10000)/100);const r=$('#svR');if(r)r.value=st.sv.rate}svFeeHint();fillSvSched();return updateSvc()}if(t.id==='svN'){st.sv.note=t.value;return}if(t.id==='svT'){st.sv.tendered=t.value;return updateSvc()}
  if(t.id==='lf-q'){st.lf.q=t.value;return renderLending()}
  if(t.id==='svD'){st.sv.due=t.value;st.sv.dueEdits={};fillSvSched();return updateSvc()}
  if(t.id==='svQ'){st.sv.customer=t.value;st.sv.customerId=null;svSuggest();return updateSvc()}
  if(t.id==='sv-amt'||t.id==='sv-fee'){const o=$('#sv-tot .mono');if(o)o.textContent=money((+$('#sv-amt').value||0)+(+(($('#sv-fee')||{}).value)||0));return}
  if(t.id==='q'){st.q=t.value;renderGrid();return}
  if(t.id==='pf'){st.pfilter=t.value;renderProducts();return}
  if(t.id==='f-q'){st.f.q=t.value;fillSales();return}
  const a=t.dataset.act;if(a==='tender'){st.tendered=t.value;return updateTotals()}if(a==='disc'){st.discV=t.value===''?0:+t.value;return updateTotals()}if(a==='cust'){st.customer=t.value;return updateTotals()}
  if(a==='custSearch'){st.customer=t.value;st.customerId=null;custSuggest();custInfoLine();return updateTotals()}
  if(t.id==='cq'){st.cq=t.value;return fillUtang()}
  if(/^spl-[cmp]-/.test(t.id)||t.id==='spl-mk')return splCalc(t);
  if(/^(p|rs)-(cost|c|mk)$/.test(t.id)){const x=t.id.split('-')[0];const c=$('#'+x+'-cost')||$('#'+x+'-c'),m=$('#'+x+'-mk');const mk=m&&m.value!==''?m.value:storeMarkup();
    const h=$('#'+x+'-hint');if(h)h.innerHTML=sugHint(c&&c.value,mk)+' <button type="button" class="x" data-act="useSug" data-src="'+x+'">Use suggestion</button>';
    const el=$('#'+x+'-price');const v=suggestPrice(c&&c.value,mk);if(el&&el.dataset.touched!=='1'&&v)el.value=v;return}
  if(t.id==='p-price'||t.id==='rs-price'){t.dataset.touched='1';return}
  if(t.id==='s-mk')return;});
document.addEventListener('change',e=>{const t=e.target;const a=t.dataset.act;
  if(t.id==='ins-month'){st.insMonth=t.value;return renderReports()}
  if(t.id==='scanPhoto'){const f=t.files&&t.files[0];t.value='';if(f)scanPhotoFile(f);return}
  if(t.id==='cshow'){st.cshow=t.value;return fillUtang()}
  if(t.id==='pl-cover'||t.id==='pl-lead'||t.id==='pl-auto'){const s2={...st.settings};if(t.id==='pl-cover')s2.coverDays=+t.value;if(t.id==='pl-lead')s2.leadDays=+t.value;if(t.id==='pl-auto')s2.autoLow=t.checked;guard(()=>Store.saveSettings(s2)).then(ok=>{if(ok){st.settings=s2;renderAll(false)}});return}
  if(t.id==='rep-day'){st.repDay=t.value;return}
  if(t.id==='rep-month'){st.repMonth=t.value;return}
  if(t.id==='rep-close'&&t.value){const s2={...st.settings,closeTime:t.value};guard(()=>Store.saveSettings(s2)).then(ok=>{if(ok){st.settings=s2;toast('Closing time saved');renderAll(false)}});return}
  if(t.id==='sv-amt'||t.id==='sv-fee'){const o=$('#sv-tot .mono');if(o)o.textContent=money((+$('#sv-amt').value||0)+(+(($('#sv-fee')||{}).value)||0));return}
  if(t.id==='sf-role'){const i=$('#sf-roleinfo');if(i)i.textContent=ROLE_INFO[t.value];return}
  if(t.id==='s-autolock'){const s2={...st.settings,autoLock:+t.value};guard(()=>Store.saveSettings(s2)).then(ok=>{if(ok){st.settings=s2;logAct('Changed auto-lock',t.value==='0'?'Off':t.value+' min');renderAll(true)}});return}
  if(t.id==='pl-all'){st.showAllPlan=t.checked;return renderRestock()}
  if(t.dataset&&t.dataset.act==='planSup'){st.plan.sup[t.dataset.id]=t.value;delete st.plan.cost[t.dataset.id];savePlan();return renderRestock()}
  if(t.id==='pl-supf'){st.supF=t.value;return renderRestock()}
  if(t.id==='rs-sup'){const p=st.products.find(x=>x.id===t.dataset.id);const e=p&&p.sup&&p.sup[t.value];const c=$('#rs-c'),m=$('#rs-mk'),pr=$('#rs-price');if(c&&e)c.value=e.cost;if(m)m.value=t.value?supMk(p,t.value):markupFor(p);if(pr)pr.dataset.touched='';if(c)c.dispatchEvent(new Event('input',{bubbles:true}));return}
  if(t.id==='d-supsel'){return docSupChanged()}
  if(t.dataset&&t.dataset.act==='planInc'){if(t.checked)delete st.plan.off[t.dataset.id];else st.plan.off[t.dataset.id]=true;savePlan();return renderRestock()}
  if(t.dataset&&(t.dataset.act==='planQty'||t.dataset.act==='planCost')){const k=t.dataset.act==='planQty'?'qty':'cost';st.plan[k][t.dataset.id]=t.value===''?'':Math.max(0,+t.value);if(k==='qty'&&!st.plan.extra.includes(t.dataset.id))st.plan.extra.push(t.dataset.id);savePlan();return renderRestock()}
  if(t.id==='pl-budget'){st.plan.budget=t.value;savePlan();return renderRestock()}
  if(t.id==='restoreFile'&&t.files&&t.files[0]){const f=t.files[0];t.value='';if(curRole()!=='Owner'){toast('Only the owner can restore a backup.');return}
    f.text().then(txt=>{let d=null;try{d=JSON.parse(txt)}catch(e){}
    if(!d||typeof d!=='object'||!Array.isArray(d.products)||!Array.isArray(d.sales)){toast('That file is not a NEXO POS backup.');return}
    confirmBox('Restore this backup?',`This replaces everything on this device with the backup from <b>${esc(d.exportedAt?new Date(d.exportedAt).toLocaleString('en-PH'):f.name)}</b>: ${d.products.length} products, ${d.sales.length} sales, ${(d.customers||[]).length} customers. Download a backup of the current data first if you might need it.`,'Restore',async()=>{closeModal();Store.applyData(d);ACT=null;LS('pos-actor',null);Store.saveLocal();restoreActor();renderAll(true);toast('Backup restored')})}).catch(()=>toast('Could not read that file.'));return}
  if(t.id==='impFile'&&t.files&&t.files[0]){const f=t.files[0];t.value='';return importFile(f)}
  if(t.dataset&&t.dataset.act==='impToggle'){IMP.rows[+t.dataset.i].on=t.checked;IMP.applyOld=$('#imp-old').checked;return showImport()}
  if(t.id==='lf-status'||t.id==='lf-type'){st.lf[t.id==='lf-status'?'status':'type']=t.value;return renderLending()}
  if(t.id==='svM'){st.sv.months=+t.value;st.sv.dueEdits={};renderServices();return}
  if(t.id&&t.id.startsWith('svI-')){st.sv.dueEdits[+t.dataset.i]=t.value;return updateSvc()}
  if(t.id==='f-type'){st.f.type=t.value;return fillSales()}
  if(t.id==='f-method'){st.f.method=t.value;return fillSales()}if(t.id==='f-from'){st.f.from=t.value;return fillSales()}if(t.id==='f-to'){st.f.to=t.value;return fillSales()}
  if(a==='setamt'){const l=st.cart[+t.dataset.i];const v2=r2(t.value);if(!(v2>0)){toast('Enter an amount greater than zero, or tap Remove.');renderCart();return}const fee=r2(l.price-l.cost);l.cost=v2;l.price=r2(v2+fee);renderCart();return}
  if(a==='setqty'){const l=st.cart[+t.dataset.i];const q=r2(t.value);if(!(q>0))st.cart.splice(+t.dataset.i,1);else l.qty=DEC_UNITS.has(l.unit)?q:(Math.round(q)||1);renderCart()}
  if(a==='discT'){st.discT=t.value;updateTotals()}
  if(t.id==='logoFile'&&t.files&&t.files[0]){const f=t.files[0];if(!/^image\//.test(f.type)){toast('Choose an image file (PNG, JPG, WEBP or SVG).');return}
    if(f.size>15*1024*1024){toast('That image is over 15 MB. Choose a smaller one.');return}
    fileToLogo(f).then(async url=>{const s={...st.settings,logo:url};if(await guard(()=>Store.saveSettings(s))){st.settings=s;renderAll(true);toast('Logo updated')}}).catch(()=>toast('Could not read that image. Try a PNG or JPG.'))}});
document.addEventListener('focusin',e=>{if(e.target.id==='svQ')svSuggest();if(e.target.id==='custQ')custSuggest()});
document.addEventListener('keydown',e=>{
  if($('#lock')&&LOCK.sel&&!$('#modalRoot').innerHTML){if(/^\d$/.test(e.key)){e.preventDefault();if(LOCK.pin.length<6){LOCK.pin+=e.key;showLock();if(LOCK.pin.length===6)lkTry()}return}if(e.key==='Backspace'){LOCK.pin=LOCK.pin.slice(0,-1);showLock();return}if(e.key==='Enter'&&LOCK.pin.length>=4){lkTry();return}if(e.key==='Escape'){LOCK.sel=null;LOCK.pin='';showLock();return}}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('#svform')){e.preventDefault();$('[data-act="svSave"]')?.click();return}
  if(e.key==='Enter'&&e.target.id==='custQ'){e.preventDefault();const f=$('#custSug .sug');if(f)f.click();return}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('#cform')){e.preventDefault();$('[data-act="saveCust"]')?.click();return}
  if(e.key==='Escape'){if($('#modalRoot').innerHTML){closeModal();return}if(st.acctOpen){st.acctOpen=false;renderAccount()}if(st.sideOpen)closeSide()}
  if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();const q=st.q.trim().toLowerCase();if(!q)return;const bySku=st.products.find(p=>(p.sku||'').toLowerCase()===q);const list=visibleProducts();const hit=bySku||(list.length===1?list[0]:null);
    if(hit){addToCart(hit.id,1);st.q='';e.target.value='';renderGrid()}else if(!list.length&&/^[0-9A-Za-z-]{6,}$/.test(st.q.trim())){const c=st.q.trim();st.q='';e.target.value='';renderGrid();unknownCode(c)}else toast(list.length?'Several items match. Tap the one you want.':'No item with that name or barcode.')}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('#pform')){e.preventDefault();$('[data-act="saveProduct"]')?.click()}});

const INSTALL={evt:null};
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function paintDL(){const b=document.getElementById('dlApp');if(b)b.hidden=isStandalone()}
function showDownload(){const ua=navigator.userAgent;const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const android=/Android/.test(ua);
  const step=(n,t)=>`<li style="display:flex;gap:12px;align-items:flex-start"><span style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700">${n}</span><span style="padding-top:3px">${t}</span></li>`;
  const how=ios?[step(1,'Tap the <b>Share</b> button at the bottom of Safari (the square with an arrow).'),step(2,'Scroll and tap <b>Add to Home Screen</b>.'),step(3,'Tap <b>Add</b>. NEXO POS appears on your home screen.')].join('')
    :android?[step(1,'Tap the menu <b>⋮</b> at the top right of Chrome.'),step(2,'Tap <b>Install app</b> or <b>Add to Home screen</b>.'),step(3,'Tap <b>Install</b>. NEXO POS appears with your apps.')].join('')
    :[step(1,'Click the <b>install icon</b> at the right end of the address bar in Chrome or Edge.'),step(2,'Click <b>Install</b>. NEXO POS opens in its own window and gets a desktop and Start menu shortcut.')].join('');
  openModal(`<h2>Download NEXO POS</h2><p class="muted" style="margin:0">Free. Works without internet after the first open. Your data stays on your device.</p>
    ${INSTALL.evt?'<button class="btn go big" data-act="installApp" style="margin-top:6px">Install now</button><p class="muted" style="margin:0;font-size:13px">If nothing happens, follow the steps below.</p>':''}
    <ol style="list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px">${how}</ol>
    ${ios&&!/Safari/.test(ua)||/CriOS|FxiOS/.test(ua)?'<p style="margin:0;color:var(--warn)">On iPhone, open this link in <b>Safari</b> to install.</p>':''}
    <p class="muted" style="margin:0;font-size:13px">Link to share with staff: <b class="mono">${esc(location.origin+location.pathname)}</b></p>
    <div class="mfoot"><button class="btn" data-act="copyLink">Copy link</button><button class="btn primary" data-act="closeModal">Close</button></div>`)}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='dlApp'){e.stopPropagation();showDownload()}
  if(t.dataset.act==='copyLink'){try{await navigator.clipboard.writeText(location.origin+location.pathname);toast('Link copied')}catch(_){toast(location.origin+location.pathname)}}},true);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL.evt=e;paintDL();if(st.loaded&&st.view==='settings')renderAll(false)});
window.addEventListener('appinstalled',()=>{INSTALL.evt=null;closeModal();paintDL();toast('NEXO POS installed')});
paintDL();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
Store.init();
</script>
